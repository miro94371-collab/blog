  controls.filter.addEventListener('click', () => { const rules = currentRules(); if (rules.some((rule) => !rule.key || (!rule.value && !['exists', 'not-exists'].includes(rule.operator)))) { setRuleStatus('Choose a metadata field and value for every condition.'); return; } const matches = state.images.filter((image) => matchesRules(image, rules)); state.visibleIds = new Set(matches.map((image) => image.id)); setRuleStatus(`${displayCount(matches.length, 'image')} match these conditions.`); render(); });
  controls.select.addEventListener('click', () => { const rules = currentRules(); if (rules.some((rule) => !rule.key || (!rule.value && !['exists', 'not-exists'].includes(rule.operator)))) { setRuleStatus('Choose a metadata field and value for every condition.'); return; } const matches = state.images.filter((image) => matchesRules(image, rules)); matches.forEach((image) => image.selected = true); setRuleStatus(`${displayCount(matches.length, 'matching image')} selected.`); render(); });
  controls.pose.addEventListener('click', () => { const poseField = availableMetadata().find((field) => metadataIdentity(field.keyPath) === 'poseindex'); if (!poseField) return; $('[data-rule-key]').value = poseField.keyPath; populateRuleFields(); $('[data-rule-operator]').value = 'equals'; $('[data-rule-value]').value = '1'; const matches = state.images.filter((image) => matchesRule(image, { key: poseField.keyPath, operator: 'equals', value: '1' })); matches.forEach((image) => image.selected = true); setRuleStatus(`${displayCount(matches.length, 'image')} with Pose Index = 1 selected.`); render(); });
  controls.selectVisible.addEventListener('click', () => { getVisible().forEach((image) => image.selected = true); render(); }); controls.deselectVisible.addEventListener('click', () => { getVisible().forEach((image) => image.selected = false); render(); }); controls.resetFilter.addEventListener('click', () => { state.visibleIds = null; setRuleStatus('Showing all imported images.'); render(); });
  const createZip = async (images) => { const now = new Date(); const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2); const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate(); let offset = 0; const local = []; const central = []; for (const image of images) { const data = new Uint8Array(await image.file.arrayBuffer()); const name = encode(image.file.name); const crc = crc32(data); const flags = 0x0800; const header = concat([u32(0x04034b50), u16(20), u16(flags), u16(0), u16(dosTime), u16(dosDate), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), name]); local.push(header, data); central.push(concat([u32(0x02014b50), u16(20), u16(20), u16(flags), u16(0), u16(dosTime), u16(dosDate), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset), name])); offset += header.length + data.length; } const centralBytes = concat(central); const end = concat([u32(0x06054b50), u16(0), u16(0), u16(images.length), u16(images.length), u32(centralBytes.length), u32(offset), u16(0)]); return new Blob([concat([...local, centralBytes, end])], { type: 'application/zip' }); };
  const dataUrlBytes = (dataUrl) => Uint8Array.from(atob(dataUrl.split(',')[1]), (character) => character.charCodeAt(0));
  const pageImage = async (image, maxWidth, maxHeight) => { const bitmap = await createImageBitmap(image.file); const bw = bitmap.width; const bh = bitmap.height; const scale = Math.min(maxWidth / bw, maxHeight / bh, 0.94); const dw = Math.floor(bw * scale); const dh = Math.floor(bh * scale); const canvas = document.createElement('canvas'); canvas.width = bw; canvas.height = bh; const context = canvas.getContext('2d'); context.fillStyle = '#ffffff'; context.fillRect(0, 0, bw, bh); context.drawImage(bitmap, 0, 0); bitmap.close(); return { bytes: dataUrlBytes(canvas.toDataURL('image/jpeg', 1.0)), sourceWidth: bw, sourceHeight: bh, pageWidth: dw, pageHeight: dh, drawWidth: dw, drawHeight: dh, x: 0, y: 0 }; };
  const createPdf = async (images) => { savePdfSize(); const mw = parseInt(pdfMaxWidth.value, 10) || 1248; const mh = parseInt(pdfMaxHeight.value, 10) || 1824; const prepared = []; for (const image of images) prepared.push(await pageImage(image, mw, mh)); let nextId = 3; const pages = prepared.map((item) => ({ ...item, pageId: nextId++, imageId: nextId++, contentId: nextId++ })); const objects = new Map(); objects.set(1, encode('<< /Type /Catalog /Pages 2 0 R >>')); objects.set(2, encode(`<< /Type /Pages /Kids [${pages.map((page) => `${page.pageId} 0 R`).join(' ')}] /Count ${pages.length} >>`)); pages.forEach((page) => { objects.set(page.imageId, concat([encode(`<< /Type /XObject /Subtype /Image /Width ${page.sourceWidth} /Height ${page.sourceHeight} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${page.bytes.length} >>\nstream\n`), page.bytes, encode('\nendstream')])); const stream = encode(`q\n${page.drawWidth} 0 0 ${page.drawHeight} ${page.x} ${page.y} cm\n/Im1 Do\nQ`); objects.set(page.contentId, concat([encode(`<< /Length ${stream.length} >>\nstream\n`), stream, encode('\nendstream')])); objects.set(page.pageId, encode(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${page.pageWidth} ${page.pageHeight}] /Resources << /XObject << /Im1 ${page.imageId} 0 R >> >> /Contents ${page.contentId} 0 R >>`)); }); const chunks = [encode('%PDF-1.3\n%\xff\xff\xff\xff\n')]; const offsets = [0]; let position = chunks[0].length; for (let id = 1; id < nextId; id++) { const object = concat([encode(`${id} 0 obj\n`), objects.get(id), encode('\nendobj\n')]); offsets[id] = position; chunks.push(object); position += object.length; } const xref = position; chunks.push(encode(`xref\n0 ${nextId}\n0000000000 65535 f \n${offsets.slice(1).map((value) => `${String(value).padStart(10, '0')} 00000 n \n`).join('')}trailer\n<< /Size ${nextId} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`)); return new Blob([concat(chunks)], { type: 'application/pdf' }); };
  controls.zip.addEventListener('click', async () => { const selected = getSelected(); controls.zip.disabled = true; controls.zip.textContent = 'Preparing ZIP...'; try { download(await createZip(selected), 'selected-images.zip'); } finally { controls.zip.textContent = 'Export ZIP'; render(); } }); controls.pdf.addEventListener('click', async () => { const selected = getSelected(); controls.pdf.disabled = true; controls.pdf.textContent = 'Preparing PDF...'; try { download(await createPdf(selected), 'selected-images.pdf'); } finally { controls.pdf.textContent = 'Export PDF'; render(); } });
  render();
})();
