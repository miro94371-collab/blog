name: Trigger Vercel Rebuild

on:
  schedule:
    - cron: "0 * * * *"   # 每小时
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git commit --allow-empty -m "Scheduled rebuild $(date -u +"%Y-%m-%d %H:%M:%S")"

          git push